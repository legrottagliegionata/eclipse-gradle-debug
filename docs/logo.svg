<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Gradle Task Debugger for Eclipse</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26334D"/>
      <stop offset="1" stop-color="#151C2C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="url(#background)"/>

  <!-- bug: the debugger -->
  <g stroke="#F5A524" stroke-width="22" stroke-linecap="round" fill="none">
    <!-- antennae -->
    <path d="M212 112 L184 72"/>
    <path d="M276 112 L304 72"/>
    <!-- legs -->
    <path d="M150 226 L96 200"/>
    <path d="M140 290 L80 290"/>
    <path d="M150 354 L96 386"/>
    <path d="M338 226 L392 200"/>
  </g>
  <circle cx="244" cy="146" r="54" fill="#F5A524"/>
  <ellipse cx="244" cy="300" rx="108" ry="132" fill="#F5A524"/>
  <!-- wing line -->
  <path d="M244 186 L244 420" stroke="#1C2538" stroke-width="12" stroke-linecap="round"/>

  <!-- run badge: the Gradle task -->
  <circle cx="378" cy="382" r="94" fill="#2FBF71" stroke="#1C2538" stroke-width="20"/>
  <path d="M352 336 L352 428 L428 382 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
</svg>
